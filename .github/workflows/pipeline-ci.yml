name: pipeline · ci

on:
  push:
    paths:
      - "pipeline/**"
      - "shared/schema/**"
      - "shared/current_run.json"
      - "shared/heatmaps/*.json"
      - "shared/behavior/model.json"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "shared/schema/**"
      - "shared/current_run.json"
      - "shared/heatmaps/*.json"
      - "shared/behavior/model.json"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest + coverage
        run: |
          pytest -q --cov=saifen_pipeline --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-coverage
          path: pipeline/coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Pipeline coverage"
            echo
            echo '```'
            python -m coverage report -m || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
