name: supabase · ci

# Duas camadas: contrato estático rápido (check_sql.py) e as RPCs
# executadas contra um Postgres/PostGIS real (supabase/tests/rpcs.sql).

on:
  push:
    paths:
      - "supabase/**"
      - "mobile/src/services/zone.ts"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "mobile/src/services/zone.ts"
      - ".github/workflows/supabase-ci.yml"

jobs:
  sql-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static RPC contract
        run: python3 supabase/tests/check_sql.py

  rpc-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Roles do Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/roles.sql
      - name: Aplicar migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "-- $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Executar RPCs (rpcs.sql)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rpcs.sql
