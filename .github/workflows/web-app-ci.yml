name: web-app · ci

on:
  push:
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package-lock.json"
      - ".github/workflows/web-app-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package-lock.json"
      - ".github/workflows/web-app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
