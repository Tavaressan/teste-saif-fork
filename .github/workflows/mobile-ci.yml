name: mobile · ci

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests (zone, crimes, profile)
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Mobile coverage"
            echo
            echo "Cobertura medida com \`node --experimental-test-coverage\` (artifact \`mobile-coverage\`)."
            echo "Piso: linhas >= 80% nos módulos cobertos (\`zone.ts\`, \`crimes.ts\`, \`profileStore.ts\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inference parity (Python fixture)
        run: npm run test:parity

      - name: Lint
        run: npm run lint

      - name: Expo doctor
        continue-on-error: true
        run: npx expo-doctor
