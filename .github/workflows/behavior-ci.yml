name: behavior · ci

on:
  push:
    paths:
      - "pipeline/behavior/**"
      - "shared/behavior/**"
      - ".github/workflows/behavior-ci.yml"
  pull_request:
    paths:
      - "pipeline/behavior/**"
      - "shared/behavior/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/behavior
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[test]"
      - name: Ruff
        run: |
          pip install ruff
          ruff check --select E,F .
      - name: Pytest + coverage
        run: |
          pytest -q --cov=behavior_pipeline --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-coverage
          path: pipeline/behavior/coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Behavior coverage"
            echo
            echo '```'
            python -m coverage report -m || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
