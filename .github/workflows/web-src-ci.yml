name: web (src) · test

on:
  push:
    paths:
      - "src/**"
      - "shared/heatmaps/heatmap_points.json"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/web-src-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "shared/heatmaps/heatmap_points.json"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
